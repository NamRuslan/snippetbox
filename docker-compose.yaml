services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: snippetbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d snippetbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  snippetbox:
    build: .
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./tls:/app/tls:ro
    command: ["./snippetbox", "-dsn=postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/snippetbox?sslmode=disable"]

volumes:
  pgdata: